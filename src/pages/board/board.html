<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>퍼스널 컬러 OOTD 자랑 게시판 (HTML 버전)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f7;
      padding: 40px 16px;
      color: #222;
    }

    .board-container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 32px 28px 40px;
    }

    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
    }

    .board-title { font-size: 26px; font-weight: bold; }
    .board-subtitle { font-size: 13px; color: #777; margin-top: 4px; }

    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
    }
    .filter-btn.active { background: #222; color: #fff; }

    /* 업로드 박스 */
    .upload-box {
      margin-top: 12px;
      border-radius: 14px;
      padding: 18px 16px 16px;
      background: #f9fafc;
      border: 1px dashed #c9ced8;
    }

    .upload-row {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    input, select, textarea {
      border: 1px solid #d4d7e1;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      background: #fff;
    }
    textarea { min-height: 80px; resize: vertical; }

    .upload-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      gap: 8px;
    }

    .btn {
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      cursor: pointer;
      border: none;
    }
    .btn-secondary { background: #edf0f5; }
    .btn-primary { background: #111827; color: #fff; }

    /* 카드 리스트 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
      gap: 16px;
      margin-top: 24px;
    }

    /* 카드 */
    .card {
      border-radius: 14px;
      background: #fafafa;
      border: 1px solid #eee;
      overflow: hidden;
      cursor: pointer;
      transition: .12s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
    }

    /* 이미지 영역 */
    .card-thumb {
      position: relative;
      padding-top: 130%;
      background: #ddd;
    }
    .card-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 배지 영역 */
    .badge-group {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .card-body {
      padding: 12px 14px 16px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #222;
    }
    .card-meta {
      font-size: 11px;
      color: #999;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.45;
    }

    @media (max-width: 768px) {
      .upload-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="board-container">

    <!-- 제목 -->
    <header class="board-header">
      <div>
        <h1 class="board-title">퍼스널 컬러 OOTD 자랑하기</h1>
        <p class="board-subtitle">퍼스널 컬러 + 체형 기반 코디 공유 ✨</p>
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active">전체</button>
        <button class="filter-btn">봄 웜</button>
        <button class="filter-btn">여름 쿨</button>
        <button class="filter-btn">가을 웜</button>
        <button class="filter-btn">겨울 쿨</button>
      </div>
    </header>

    <!-- 업로드 영역 -->
    <section class="upload-box">
      <form id="ootdForm">

        <div class="upload-row">

          <!-- 왼쪽 -->
          <div>
            <div class="form-group">
              <label>코디 사진</label>
              <input type="file" id="photoInput" accept="image/*" required />
            </div>

            <div class="form-group">
              <label>퍼스널 컬러</label>
              <select id="colorInput">
                <option value="">선택해주세요</option>
                <option>봄 웜</option>
                <option>여름 쿨</option>
                <option>가을 웜</option>
                <option>겨울 쿨</option>
              </select>
            </div>

            <div class="form-group">
              <label>퍼스널 체형</label>
              <select id="bodyInput">
                <option value="">체형 선택</option>
                <option>사과형</option>
                <option>배형</option>
                <option>역삼각형</option>
                <option>직사각형</option>
                <option>모래시계형</option>
              </select>
            </div>
          </div>

          <!-- 오른쪽 -->
          <div>
            <div class="form-group">
              <label>제목</label>
              <input type="text" id="titleInput" placeholder="오늘 코디 한 줄 소개" />
            </div>

            <div class="form-group">
              <label>스타일 태그</label>
              <input type="text" id="tagInput" placeholder="예: 데일리룩" />
            </div>

            <div class="form-group">
              <label>코디 설명</label>
              <textarea id="descInput" placeholder="컬러 + 체형 기반 코디 설명"></textarea>
            </div>
          </div>

        </div>

        <div class="upload-actions">
          <button type="reset" class="btn btn-secondary">초기화</button>
          <button type="submit" class="btn btn-primary">등록하기</button>
        </div>

      </form>
    </section>

    <!-- 이미지 카드 리스트 -->
    <section class="card-grid" id="cardGrid">

      <!-- ⭐ 예시 카드 1 -->
      <article class="card">
        <div class="card-thumb">
          <img src="https://picsum.photos/id/1011/500/700" />
          <div class="badge-group">
            <span class="badge">봄 웜</span>
            <span class="badge">모래시계형</span>
            <span class="badge">#출근룩</span>
          </div>
        </div>
        <div class="card-body">
          <h2 class="card-title">아이보리 자켓 봄웜 출근룩</h2>
          <div class="card-meta">
            <span>pinky</span>
            <span>2025.03.01</span>
          </div>
          <p class="card-desc">
            봄웜 컬러 조합 + 모래시계형 체형 비율을 고려한 출근 데일리룩.
          </p>
        </div>
      </article>

      <!-- ⭐ 예시 카드 2 -->
      <article class="card">
        <div class="card-thumb">
          <img src="https://picsum.photos/id/1025/500/700" />
          <div class="badge-group">
            <span class="badge">겨울 쿨</span>
            <span class="badge">역삼각형</span>
            <span class="badge">#데일리룩</span>
          </div>
        </div>
        <div class="card-body">
          <h2 class="card-title">블랙&화이트 겨울쿨 무드</h2>
          <div class="card-meta">
            <span>cooltone_luv</span>
            <span>2025.02.20</span>
          </div>
          <p class="card-desc">
            어깨가 넓은 역삼각형 체형 보완 + 겨울쿨 정석 조합.
          </p>
        </div>
      </article>

    </section>

  </div>

  <!-- JS: 업로드 → 카드 생성 -->
  <script>
    const form = document.getElementById("ootdForm");
    const cardGrid = document.getElementById("cardGrid");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const file = photoInput.files[0];
      const color = colorInput.value;
      const body = bodyInput.value;
      const title = titleInput.value || "제목 없음";
      const tag = tagInput.value.trim();
      const desc = descInput.value || "";

      if (!file) return alert("사진을 업로드하세요!");

      const photoURL = URL.createObjectURL(file);
      const today = new Date().toLocaleDateString("ko-KR");

      // 새 카드 생성
      const card = document.createElement("article");
      card.className = "card";

      card.innerHTML = `
        <div class="card-thumb">
          <img src="${photoURL}" />
          <div class="badge-group">
            ${color ? `<span class="badge">${color}</span>` : ""}
            ${body ? `<span class="badge">${body}</span>` : ""}
            ${tag ? `<span class="badge">#${tag}</span>` : ""}
          </div>
        </div>

        <div class="card-body">
          <h2 class="card-title">${title}</h2>
          <div class="card-meta">
            <span>익명</span>
            <span>${today}</span>
          </div>
          <p class="card-desc">${desc}</p>
        </div>
      `;

      cardGrid.prepend(card);
      form.reset();
    });
  </script>
</body>
</html>
